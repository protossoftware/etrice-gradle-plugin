plugins {
	id "org.asciidoctor.jvm.convert"
}

import javax.inject.Inject

import org.gradle.api.DefaultTask
import org.gradle.api.file.ArchiveOperations
import org.gradle.api.file.DirectoryProperty
import org.gradle.api.file.FileSystemOperations
import org.gradle.api.file.RegularFileProperty
import org.gradle.api.tasks.InputFile
import org.gradle.api.tasks.OutputDirectory
import org.gradle.api.tasks.PathSensitive
import org.gradle.api.tasks.PathSensitivity
import org.gradle.api.tasks.TaskAction

configurations {
	javadoc
}

dependencies {
	javadoc project(path: ':subprojects:de.protos.etrice.gradle', configuration: 'javadocElements')
}

asciidoctor {
	outputDir = layout.buildDirectory.dir("site")
	attributes "version-plugin" : project.version,
		"version-etrice" : '5.4.0',
		// minimum Gradle version supported by the published plugins, see FunctionalTests
		"version-gradle" : '7.6'
}

tasks.register("unzipJavadoc", UnzipJavadocTask) {
	dependsOn(configurations.javadoc)
	javadocZip.fileProvider(configurations.javadoc.getElements().map { it.first().asFile })
	destination.set(layout.buildDirectory.dir("site/javadoc"))
}

tasks.register("buildSite") {
	dependsOn("asciidoctor", "unzipJavadoc")
}

/**
 * Extracts the javadoc jar of the plugin project into the site directory.
 */
abstract class UnzipJavadocTask extends DefaultTask {

	@Inject
	abstract ArchiveOperations getArchiveOperations()

	@Inject
	abstract FileSystemOperations getFileSystemOperations()

	@InputFile
	@PathSensitive(PathSensitivity.NONE)
	abstract RegularFileProperty getJavadocZip()

	@OutputDirectory
	abstract DirectoryProperty getDestination()

	@TaskAction
	protected void unzip() {
		fileSystemOperations.sync {
			from(archiveOperations.zipTree(javadocZip.get().asFile))
			into(destination)
		}
	}
}
